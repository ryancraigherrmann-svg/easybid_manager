AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EasyBid - SES Configuration Set and SNS topic for bounce/complaint notifications.

Parameters:
  EnvironmentName:
    Type: String
    Default: production

  Domain:
    Type: String
    Default: ezbidapp.com
    Description: Existing SES-verified domain used for reminders/documentation

  MailFromSubdomain:
    Type: String
    Default: mail
    Description: Existing MAIL FROM subdomain used for reminders/documentation

Resources:
  # ---------- SNS Topic for Bounce & Complaint Notifications ----------
  SESNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub easybid-${EnvironmentName}-ses-notifications
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ---------- SES Configuration Set ----------
  # Links SES sending to the SNS topic for bounce/complaint events
  SESConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub easybid-${EnvironmentName}-config

  # Bounce event destination → SNS
  SESBounceEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref SESConfigurationSet
      EventDestination:
        Name: bounces
        Enabled: true
        MatchingEventTypes:
          - bounce
        SnsDestination:
          TopicARN: !Ref SESNotificationTopic

  # Complaint event destination → SNS
  SESComplaintEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref SESConfigurationSet
      EventDestination:
        Name: complaints
        Enabled: true
        MatchingEventTypes:
          - complaint
        SnsDestination:
          TopicARN: !Ref SESNotificationTopic

Outputs:
  # ── DNS Records you must add ──
  # After deploying this stack, add these records to your domain's DNS.

  ConfigurationSetName:
    Description: SES Configuration Set name (pass to backend as SES_CONFIG_SET env var)
    Value: !Ref SESConfigurationSet
    Export:
      Name: !Sub easybid-${EnvironmentName}-SESConfigSetName

  SNSTopicArn:
    Description: SNS Topic ARN for SES bounce/complaint notifications
    Value: !Ref SESNotificationTopic
    Export:
      Name: !Sub easybid-${EnvironmentName}-SESNotificationTopicArn

  DnsRecordsReminder:
    Description: |
      This stack assumes SES identity already exists for the domain.
      Verify your DNS still contains DKIM/SPF/DMARC and MAIL FROM records.
    Value: !Sub 'Using existing SES identity for ${Domain}'
