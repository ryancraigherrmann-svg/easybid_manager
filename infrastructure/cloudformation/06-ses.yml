AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EasyBid - SES Domain Identity, DKIM, Custom MAIL FROM, Configuration Set,
  and SNS topic for bounce/complaint notifications.

Parameters:
  EnvironmentName:
    Type: String
    Default: production

  Domain:
    Type: String
    Default: ezbidapp.com
    Description: The domain to verify and send email from

  MailFromSubdomain:
    Type: String
    Default: mail
    Description: Subdomain used for custom MAIL FROM (e.g. mail.ezbidapp.com)

Resources:
  # ---------- SNS Topic for Bounce & Complaint Notifications ----------
  SESNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub easybid-${EnvironmentName}-ses-notifications
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ---------- SES Configuration Set ----------
  # Links SES sending to the SNS topic for bounce/complaint events
  SESConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub easybid-${EnvironmentName}-config

  # Bounce event destination → SNS
  SESBounceEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref SESConfigurationSet
      EventDestination:
        Name: bounces
        Enabled: true
        MatchingEventTypes:
          - bounce
        SnsDestination:
          TopicARN: !Ref SESNotificationTopic

  # Complaint event destination → SNS
  SESComplaintEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref SESConfigurationSet
      EventDestination:
        Name: complaints
        Enabled: true
        MatchingEventTypes:
          - complaint
        SnsDestination:
          TopicARN: !Ref SESNotificationTopic

  # ---------- SES Domain Identity (DKIM) ----------
  # Creates the domain identity and enables Easy DKIM (3 CNAME records)
  SESDomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref Domain
      DkimAttributes:
        SigningEnabled: true
      MailFromAttributes:
        MailFromDomain: !Sub ${MailFromSubdomain}.${Domain}
        BehaviorOnMxFailure: USE_DEFAULT_VALUE
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref SESConfigurationSet

Outputs:
  # ── DNS Records you must add ──
  # After deploying this stack, add these records to your domain's DNS.

  ConfigurationSetName:
    Description: SES Configuration Set name (pass to backend as SES_CONFIG_SET env var)
    Value: !Ref SESConfigurationSet
    Export:
      Name: !Sub easybid-${EnvironmentName}-SESConfigSetName

  SNSTopicArn:
    Description: SNS Topic ARN for SES bounce/complaint notifications
    Value: !Ref SESNotificationTopic
    Export:
      Name: !Sub easybid-${EnvironmentName}-SESNotificationTopicArn

  DkimToken1:
    Description: 'DKIM CNAME Record 1 — Name: {token1}._domainkey.ezbidapp.com → Value: {token1}.dkim.amazonses.com'
    Value: !GetAtt SESDomainIdentity.DkimDNSTokenName1

  DkimToken2:
    Description: 'DKIM CNAME Record 2 — Name: {token2}._domainkey.ezbidapp.com → Value: {token2}.dkim.amazonses.com'
    Value: !GetAtt SESDomainIdentity.DkimDNSTokenName2

  DkimToken3:
    Description: 'DKIM CNAME Record 3 — Name: {token3}._domainkey.ezbidapp.com → Value: {token3}.dkim.amazonses.com'
    Value: !GetAtt SESDomainIdentity.DkimDNSTokenName3

  DkimValue1:
    Value: !GetAtt SESDomainIdentity.DkimDNSTokenValue1
  DkimValue2:
    Value: !GetAtt SESDomainIdentity.DkimDNSTokenValue2
  DkimValue3:
    Value: !GetAtt SESDomainIdentity.DkimDNSTokenValue3

  DnsRecordsReminder:
    Description: |
      After deploying, add these DNS records to ezbidapp.com:
      1) 3 DKIM CNAMEs (see DkimToken outputs above)
      2) SPF TXT on ezbidapp.com:  v=spf1 include:amazonses.com ~all
      3) Custom MAIL FROM MX on mail.ezbidapp.com:  10 feedback-smtp.us-east-2.amazonses.com
      4) Custom MAIL FROM SPF TXT on mail.ezbidapp.com:  v=spf1 include:amazonses.com ~all
      5) DMARC TXT on _dmarc.ezbidapp.com:  v=DMARC1; p=none; rua=mailto:dmarc@ezbidapp.com
    Value: 'See description for required DNS records'
